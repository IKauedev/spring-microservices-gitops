apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Proibir tag latest
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [department, employee, organization, gateway]
      validate:
        message: "Use uma tag de versao fixa; imagens sem tag nao sao permitidas."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [department, employee, organization, gateway]
      validate:
        message: "A tag 'latest' nao e permitida."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
