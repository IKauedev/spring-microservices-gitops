apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/policies
# prod bloqueia violacoes; require-non-root fica em Audit ate os rollouts terem securityContext
patches:
  - target:
      kind: ClusterPolicy
      name: "(disallow-latest-tag|require-resources|require-probes)"
    patch: |-
      - op: replace
        path: /spec/validationFailureAction
        value: Enforce
